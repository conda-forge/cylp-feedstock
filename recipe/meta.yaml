{% set name = "cylp" %}
{% set version = "0.94.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/coin-or/CyLP/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f0accddc7b7137d5b173feb0f39f33cef4ee19b2474f6d753a4c568301274399

build:
  script:
    - export COIN_INSTALL_DIR=$PREFIX  # [unix]
    - set COIN_INSTALL_DIR=%LIBRARY_PREFIX%  # [win]
    # The COIN-OR libraries are static on Windows, and CoinUtils calls LAPACK
    - set "LINK=%LINK% %LIBRARY_LIB%\mkl_rt.lib"  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.0.10,<3.4                   # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - cython >=3.0.10,<3.4
    - numpy
    - coin-or-cbc
    - coin-or-cgl
    - coin-or-clp
    - coin-or-osi
    - coin-or-utils
    - mkl-devel  # [win]
  run:
    - python
    - numpy >=1.26.0
    - scipy >=0.10.0
    - coin-or-cbc
    - coin-or-cgl
    - coin-or-clp
    - coin-or-osi
    - coin-or-utils

test:
  source_files:
    - cylp/tests
    - cylp/input
  requires:
    - pip
    - pytest
  imports:
    - cylp
    - cylp.cy
  commands:
    - pip check
    - pytest cylp/tests

about:
  home: https://github.com/coin-or/cylp
  summary: A Python interface for CLP, CBC, and CGL
  license: EPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tkralphs
    - nilchia
